update_ip:
  name: Update IP Address
  description: Update the IP address of an Elegoo Printer config entry and reload it.
  fields:
    entry_id:
      name: Config Entry
      description: Choose the printer who needs to change its IP.
      required: true
      selector:
        config_entry:
          integration: elegoo_printer
    ip_address:
      name: IP Address
      description: "Type the new IP address (Example: 192.168.1.3)."
      example: "192.168.1.3"
      required: true
      selector:
        text:

start_print:
  name: Start Print
  description: >-
    Start a G-code file that is already in the printer's local storage.
    Centauri Carbon 2 only. The response reports whether the printer accepted
    the job (error_code 1009 means it is busy).
  fields:
    entry_id:
      name: Config Entry
      description: The Centauri Carbon 2 to print on.
      required: true
      selector:
        config_entry:
          integration: elegoo_printer
    filename:
      name: File name
      description: "Exact file name on the printer, as shown in its file list."
      example: "benchy.gcode"
      required: true
      selector:
        text:
    tray:
      name: Canvas tray
      description: >-
        Tray to print from, 0-3 (A1-A4). Leave empty to let the printer choose.
        Maps every G-code tool the file uses; a file whose tool list the
        printer never reported maps its first tool.
      required: false
      selector:
        number:
          min: 0
          max: 3
          mode: box
    bed_leveling:
      name: Bed leveling
      description: >-
        Run auto bed leveling before the print, as the slicer does (about three
        minutes). Switch off for a faster reprint: the printer is then told not
        to level, the same way the slicer's own checkbox does it.
      required: false
      default: true
      selector:
        boolean:

upload_gcode:
  name: Upload G-code
  description: >-
    Upload a G-code file from this device to the printer's local storage, and
    optionally start printing it. Centauri Carbon 2 only. The file keeps its
    name; an existing file of the same name is replaced.
  fields:
    entry_id:
      name: Config Entry
      description: The Centauri Carbon 2 to upload to.
      required: true
      selector:
        config_entry:
          integration: elegoo_printer
    file:
      name: G-code file
      description: Pick a .gcode file on this device.
      required: true
      selector:
        file:
          accept: ".gcode"
    start:
      name: Start printing
      description: Start the print as soon as the upload is complete.
      required: false
      default: false
      selector:
        boolean:
    tray:
      name: Canvas tray
      description: >-
        Tray to print from, 0-3 (A1-A4), only with "Start printing". Leave
        empty to let the printer choose. Maps every G-code tool the file uses;
        a file whose tool list the printer never reported maps its first tool.
      required: false
      selector:
        number:
          min: 0
          max: 3
          mode: box
    bed_leveling:
      name: Bed leveling
      description: >-
        Run auto bed leveling before the print, as the slicer does (about three
        minutes). Switch off to skip it. Only with "Start printing".
      required: false
      default: true
      selector:
        boolean:


cleanup_files:
  name: Clean up printer files
  description: >-
    Delete old G-code files from a printer's local storage, by age and by name
    pattern. Centauri Carbon 2 only, and DRY RUN BY DEFAULT: the first call
    reports which files it would delete and deletes nothing, so run it once and
    read the answer before switching the dry run off. Whether a delete actually
    happened is confirmed by re-reading the printer's file list, not by trusting
    its reply - the delete command is documented as untested on hardware and its
    reply shape is not documented at all, so a file the printer accepted and
    kept comes back as failed. Two kinds of file are never deleted: the file the
    printer is printing right now, and any file whose creation date it did not
    report - including a file dated before 2000, which is how a printer whose
    clock has never been set reports a date, so an unset clock means nothing
    gets deleted rather than everything getting deleted. Videos cannot be
    deleted (see the README: the printer's file list is the only inventory this
    integration has ever seen, and the camera is a live stream rather than a
    file).
  fields:
    entry_id:
      name: Config Entry
      description: The Centauri Carbon 2 to clean up.
      required: true
      selector:
        config_entry:
          integration: elegoo_printer
    older_than_days:
      name: Older than (days)
      description: >-
        Whole number of days. A file is only a candidate when its creation date
        is strictly older than this; fractions are rejected rather than rounded
        down, because rounding down would delete slightly more than you asked
        for. Defaults to 60.
      required: false
      default: 60
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    include:
      name: Include patterns
      description: >-
        File names to consider, as glob patterns - "ECC*" matches every file
        whose name starts with ECC. Omit this field to mean every file, which is
        the default. A field that is present but BLANK matches nothing, so
        nothing is deleted: a nightly job left in that state stays inert, and
        the response says the pattern matched nothing rather than reporting a
        quiet success. Excluded files are never deleted even when they match
        this too. Case matters, the same way on every machine.
      example: "ECC*"
      required: false
      selector:
        text:
    exclude:
      name: Exclude patterns
      description: >-
        File names to keep, as glob patterns - "Keep*" keeps every file whose
        name starts with Keep. Exclusion wins over inclusion, so a file matching
        both is kept. Leave this field EMPTY to keep nothing special, which is
        the default.
      example: "Keep*"
      required: false
      selector:
        text:
    dry_run:
      name: Dry run
      description: >-
        On (the default) reports the files that would be deleted and deletes
        nothing. Switch off to delete them. Only the literal off switch deletes:
        a value that is not exactly off is treated as a dry run.
      required: false
      default: true
      selector:
        boolean:
